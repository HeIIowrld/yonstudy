name: Build desktop Whisper runtime

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/desktop-runtime.yml
    tags:
      - desktop-runtime-v*

permissions:
  contents: read

env:
  WHISPER_CPP_COMMIT: 48f628a84833905ee4a0658ee6d4a5c915ce1997
  VULKAN_SDK_VERSION: 1.3.290.0
  ARCHIVE_NAME: yonstudy-whisper-vulkan-v1.8.7-win-x64.zip

jobs:
  build-windows-vulkan:
    runs-on: windows-2022
    steps:
      - name: Install Vulkan SDK
        shell: pwsh
        run: |
          choco install vulkan-sdk --version $env:VULKAN_SDK_VERSION --yes --no-progress
          "C:\VulkanSDK\$env:VULKAN_SDK_VERSION\Bin" | Out-File -FilePath $env:GITHUB_PATH -Append
          "VULKAN_SDK=C:\VulkanSDK\$env:VULKAN_SDK_VERSION" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Fetch pinned whisper.cpp source
        shell: pwsh
        run: |
          git clone --filter=blob:none https://github.com/ggml-org/whisper.cpp.git whisper.cpp
          git -C whisper.cpp checkout --detach $env:WHISPER_CPP_COMMIT

      - name: Configure and build Vulkan with CPU fallback
        shell: pwsh
        run: |
          cmake -S whisper.cpp -B whisper.cpp/build -A x64 `
            -DGGML_VULKAN=ON `
            -DGGML_BACKEND_DL=ON `
            -DGGML_NATIVE=OFF `
            -DWHISPER_BUILD_TESTS=OFF `
            -DWHISPER_BUILD_SERVER=OFF
          cmake --build whisper.cpp/build --config Release --target whisper-cli --parallel
          Copy-Item whisper.cpp/LICENSE whisper.cpp/build/bin/Release/LICENSE
          @("whisper-cli.exe", "ggml-vulkan.dll", "ggml-cpu.dll") | ForEach-Object {
            if (-not (Test-Path "whisper.cpp/build/bin/Release/$_")) {
              throw "Required runtime file is missing: $_"
            }
          }
          whisper.cpp/build/bin/Release/whisper-cli.exe --version

      - name: Package runtime and checksum
        shell: pwsh
        run: |
          Compress-Archive -Path whisper.cpp/build/bin/Release -DestinationPath $env:ARCHIVE_NAME
          $hash = (Get-FileHash $env:ARCHIVE_NAME -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $env:ARCHIVE_NAME" | Out-File "$env:ARCHIVE_NAME.sha256" -Encoding ascii

      - name: Upload runtime artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-whisper-vulkan-runtime
          path: |
            ${{ env.ARCHIVE_NAME }}
            ${{ env.ARCHIVE_NAME }}.sha256
          if-no-files-found: error

  publish-release:
    if: startsWith(github.ref, 'refs/tags/desktop-runtime-v')
    needs: build-windows-vulkan
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download runtime artifact
        uses: actions/download-artifact@v4
        with:
          name: desktop-whisper-vulkan-runtime
          path: dist

      - name: Publish runtime release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "dist/${ARCHIVE_NAME}" \
            "dist/${ARCHIVE_NAME}.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Desktop Whisper runtime ${GITHUB_REF_NAME}" \
            --notes "Pinned whisper.cpp v1.8.7 Windows x64 runtime with Vulkan and CPU backends."
