name: yonstudy

services:
  scheduler:
    image: yonstudy:local
    build:
      context: ${YONSTUDY_SOURCE_DIR}
      dockerfile: Dockerfile
    container_name: yonstudy
    restart: unless-stopped
    init: false
    environment:
      TZ: Asia/Seoul
    volumes:
      - ${YONSTUDY_DATA_DIR}/store:/data/store
      - ${YONSTUDY_DATA_DIR}/logs:/data/logs
      - ${YONSTUDY_CONFIG_DIR}:/config:ro
      - ${YONSTUDY_ARCHIVE_DIR}:/archive
    shm_size: 1gb
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  updater:
    image: docker:27-cli
    container_name: yonstudy-updater
    restart: unless-stopped
    environment:
      TZ: Asia/Seoul
      YONSTUDY_REPOSITORY: HeIIowrld/yonstudy
      YONSTUDY_UPDATE_INTERVAL: "300"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - apk add --no-cache curl git jq;
        git config --global --add safe.directory /source;
        exec /source/deploy/update-loop.sh
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${YONSTUDY_SOURCE_DIR}:/source
      - ${YONSTUDY_DATA_DIR}/.env:/deployment/.env:ro
      - ${YONSTUDY_DATA_DIR}/deploy-state:/state
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"
