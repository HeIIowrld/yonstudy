name: yonstudy

services:
  scheduler:
    image: yonstudy:local
    build:
      context: ${YONSTUDY_BUILD_CONTEXT}
      dockerfile: Dockerfile
    container_name: yonstudy
    restart: unless-stopped
    init: false
    environment:
      TZ: Asia/Seoul
    volumes:
      - ${YONSTUDY_DATA_DIR}/store:/data/store
      - ${YONSTUDY_DATA_DIR}/logs:/data/logs
      - ${YONSTUDY_RECORDING_HOST_DIR:-${YONSTUDY_ARCHIVE_DIR}/../00.녹음_넣기}:/data/inbox/recordings
      - ${YONSTUDY_CONFIG_DIR}:/config:ro
      - ${YONSTUDY_ARCHIVE_DIR}:/archive
    shm_size: 1gb
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  updater:
    image: docker:27-cli
    container_name: yonstudy-updater
    restart: unless-stopped
    environment:
      TZ: Asia/Seoul
      YONSTUDY_REPOSITORY: HeIIowrld/yonstudy
      YONSTUDY_UPDATE_INTERVAL: "300"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - apk add --no-cache curl git jq;
        git config --global --add safe.directory /source;
        exec /source/deploy/update-loop.sh
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${YONSTUDY_SOURCE_DIR}:/source
      - ${YONSTUDY_DATA_DIR}/.env:/deployment/.env:ro
      - ${YONSTUDY_DATA_DIR}/deploy-state:/state
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"

  transcriber:
    profiles: ["transcription"]
    image: yonstudy-transcriber:local
    build:
      context: ${YONSTUDY_BUILD_CONTEXT}
      dockerfile: Dockerfile.transcribe
    container_name: yonstudy-transcriber
    restart: unless-stopped
    environment:
      TZ: Asia/Seoul
      YONSTUDY_TRANSCRIBE_ROOT: ${YONSTUDY_TRANSCRIBE_ROOT:-/archive}
      YONSTUDY_TRANSCRIBE_MODEL: ${YONSTUDY_TRANSCRIBE_MODEL:-medium}
      YONSTUDY_TRANSCRIBE_DEVICE: ${YONSTUDY_TRANSCRIBE_DEVICE:-cpu}
      YONSTUDY_TRANSCRIBE_COMPUTE_TYPE: ${YONSTUDY_TRANSCRIBE_COMPUTE_TYPE:-int8}
      YONSTUDY_TRANSCRIBE_LANGUAGE: ${YONSTUDY_TRANSCRIBE_LANGUAGE:-auto}
      YONSTUDY_TRANSCRIBE_STABLE_SECONDS: ${YONSTUDY_TRANSCRIBE_STABLE_SECONDS:-120}
      YONSTUDY_TRANSCRIBE_CPU_THREADS: ${YONSTUDY_TRANSCRIBE_CPU_THREADS:-0}
      YONSTUDY_TRANSCRIBE_INTERVAL: ${YONSTUDY_TRANSCRIBE_INTERVAL:-1800}
      YONSTUDY_TRANSCRIBE_LIMIT: ${YONSTUDY_TRANSCRIBE_LIMIT:-1}
      YONSTUDY_TRANSCRIBE_MODEL_CACHE: /models
    volumes:
      - ${YONSTUDY_ARCHIVE_DIR}:/archive
      - ${YONSTUDY_DATA_DIR}/models:/models
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
